name: Build Windows app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}"
          } else {
            $raw = python -c "import re; print(re.search(r'APP_VERSION = \"(.+)\"', open('app.py').read()).group(1))"
            $version = "v$raw"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller pystray pillow

      - name: Install Playwright Chromium
        shell: pwsh
        run: .venv\Scripts\python -m playwright install chromium

      - name: Resolve bundled ffmpeg path
        id: bins
        shell: pwsh
        run: |
          $ffmpeg = .venv\Scripts\python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          "ffmpeg=$ffmpeg" >> $env:GITHUB_OUTPUT

      - name: Download cloudflared
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Download standalone yt-dlp
        shell: pwsh
        run: |
          # NOT .venv\Scripts\yt-dlp.exe - pip's generated launcher for that
          # embeds a path back to this specific ephemeral runner's venv,
          # which won't exist on an end user's machine. This is yt-dlp's own
          # self-contained release build, bundled with its own interpreter.
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp.exe"

      - name: Generate icon and tray image
        shell: pwsh
        run: |
          .venv\Scripts\python -c "from PIL import Image; img = Image.open('branding/app_icon_master.png'); img.save('icon.ico', sizes=[(16,16),(32,32),(48,48),(128,128),(256,256)]); img.resize((128,128)).save('trayicon.png')"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          .venv\Scripts\pyinstaller --noconfirm --windowed --name "Live Tools" `
            --add-data "static;static" `
            --add-data "overlay/template.html;overlay" `
            --add-binary "${{ steps.bins.outputs.ffmpeg }};." `
            --add-binary "yt-dlp.exe;." `
            --add-binary "cloudflared.exe;." `
            --add-data "$env:LOCALAPPDATA\ms-playwright;ms-playwright" `
            --add-data "trayicon.png;." `
            --icon "icon.ico" `
            desktop_launcher.py

      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path "dist\Live Tools\*" -DestinationPath "Live.Tools.${{ steps.version.outputs.version }}.Windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Live-Tools-Windows
          path: "Live.Tools.${{ steps.version.outputs.version }}.Windows.zip"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "Live.Tools.${{ steps.version.outputs.version }}.Windows.zip" --clobber
