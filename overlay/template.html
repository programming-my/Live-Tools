<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    /* Solid chroma-key blue rather than a real alpha channel - much
       simpler and more universally compatible: any editor can key this out,
       vs. alpha-channel HEVC/ProRes needing specific codec/container
       support that isn't reliably available everywhere. Blue, not green -
       confirmed by testing that the bid pill's own green (#4ce160) is close
       enough to pure chroma green that keying would eat into it too;
       nothing in this design is blue-toned, so blue keys cleanly. */
    background: #0000ff;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
  }
  .overlay {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Auction card only - just the pinned product with auction data, styled
     after static/overlay_mobile.css's design (ported from that file's fixed
     720px-wide px values back to vw, at the same 7.2px-per-vw ratio, since
     this page is rendered at the source video's own resolution per run,
     not always 720 wide - unlike that file's locked 720x1280 canvas). */
  .auction-card {
    position: absolute;
    left: 3%;
    right: 3%;
    bottom: 3%;
    /* Fully opaque (not the ~0.94 translucent look used elsewhere) so no
       green spills through the card itself once chroma-keyed. */
    background: #121212;
    border-radius: 3.06vw;
    padding: 3.06vw 3.47vw;
  }
  .auction-title-row {
    display: flex;
    align-items: center;
    gap: 1.53vw;
    margin-bottom: 1.67vw;
  }
  .auction-title {
    flex: 1;
    font-weight: 700;
    font-size: 2.78vw;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .auction-chevron {
    font-size: 4.03vw;
    color: #9aa1ac;
    flex-shrink: 0;
  }
  .auction-price {
    font-size: 4.17vw;
    font-weight: 800;
    margin-bottom: 1.67vw;
  }
  .auction-status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.94vw;
  }
  .auction-winner {
    font-size: 3.89vw;
    color: #eee;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .auction-timer {
    font-size: 4.17vw;
    color: #ff4d4f;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    margin-left: 1.94vw;
  }
  .auction-buttons {
    display: flex;
    align-items: stretch;
    gap: 2.36vw;
    height: 8.61vw;
  }
  .btn-max-bid {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0.28vw solid #fff;
    border-radius: 999px;
    padding: 0 4.44vw;
    font-size: 4.17vw;
    font-weight: 600;
    color: #fff;
  }
  /* Not biddable ("pinned"/starting-soon or "ended"/sold-out) - greyed out. */
  .btn-max-bid.muted {
    border-color: rgba(255, 255, 255, 0.35);
    color: rgba(255, 255, 255, 0.5);
  }
  .btn-bid {
    flex: 1;
    position: relative;
    border: 0.28vw solid #fff;
    border-radius: 999px;
  }
  .btn-bid.muted {
    border-color: #000;
  }
  .btn-bid-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 85%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.53vw;
    background: #4ce160;
    border-radius: 999px;
    padding: 0 4.44vw;
    font-size: 4.17vw;
    font-weight: 700;
    color: #0c310d;
    /* A high bid price (e.g. over $100,000) is long enough to wrap onto a
       second line otherwise - force it onto one line instead, now that the
       wider fill above gives it more room to actually fit. */
    white-space: nowrap;
  }
  /* "Starting soon" (pinned, not yet active) / "Sold out" (ended) - neutral
     rather than the vivid green "Bid now" fill, since neither is biddable.
     Slightly larger than the ring (rather than flush with it) so a thin
     sliver of the grey fill peeks out beyond the black border. */
  .btn-bid-fill.muted {
    top: -0.42vw;
    left: -0.42vw;
    right: -0.42vw;
    bottom: -0.42vw;
    width: auto;
    justify-content: center;
    background: #55565a;
    color: #000;
  }
  .btn-bid-fill svg {
    height: 2.36vw;
    width: auto;
    flex-shrink: 0;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="overlay">
    <div class="auction-card hidden" id="auctionCard">
      <div class="auction-title-row">
        <div class="auction-title" id="auctionTitle"></div>
        <span class="auction-chevron">›</span>
      </div>
      <div class="auction-price" id="auctionPrice"></div>
      <div class="auction-status-row hidden" id="auctionStatusRow">
        <span class="auction-winner" id="auctionWinner"></span>
        <span class="auction-timer" id="auctionTimer"></span>
      </div>
      <div class="auction-buttons">
        <div class="btn-max-bid" id="maxBidBtn">Max bid</div>
        <div class="btn-bid" id="bidPillContainer">
          <div class="btn-bid-fill" id="bidPillFill">
            <span id="bidPillText">Bid now</span>
            <svg id="bidPillChevron" viewBox="135 17 24 21" xmlns="http://www.w3.org/2000/svg">
              <path fill="#0c310d" d="M157.6803,29.0305l-8.3939,8.3941c-.5472.5464-1.4327.5464-1.9789,0-.5462-.5463-.5462-1.4321,0-1.9785l7.405-7.4049-7.405-7.4049c-.5462-.5464-.5462-1.4321,0-1.9785.5462-.5464,1.4317-.5464,1.9789,0l8.3939,8.3942c.5462.5464.5462,1.4322,0,1.9785ZM146.4887,29.0305l-8.3939,8.3941c-.5462.5464-1.4317.5464-1.9789,0-.5462-.5463-.5462-1.4321,0-1.9785l7.405-7.4049-7.405-7.4049c-.5462-.5464-.5462-1.4321,0-1.9785.5472-.5464,1.4327-.5464,1.9789,0l8.3939,8.3942c.5462.5464.5462,1.4322,0,1.9785Z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  function formatMoney(amount, currency) {
    if (amount === null || amount === undefined) return "";
    const symbol = currency === "USD" ? "$" : (currency || "");
    return symbol + amount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatTimer(seconds) {
    const value = (seconds === null || seconds === undefined) ? 0 : seconds;
    const total = Math.max(0, Math.round(value));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `🕐 ${m}:${String(s).padStart(2, "0")}`;
  }

  // Called once per rendered frame by overlay/render.py, already handed an
  // exact remaining_seconds for that instant - no local countdown ticking
  // needed here (unlike the live browser overlay).
  function applyState(state) {
    const auctionCard = document.getElementById("auctionCard");
    const auction = state.auction;
    if (!auction) {
      auctionCard.classList.add("hidden");
      return;
    }
    auctionCard.classList.remove("hidden");
    document.getElementById("auctionTitle").textContent = auction.title || "";
    document.getElementById("auctionPrice").textContent = formatMoney(auction.price, auction.currency);

    const auctionStatusRow = document.getElementById("auctionStatusRow");
    const auctionWinner = document.getElementById("auctionWinner");
    const auctionTimer = document.getElementById("auctionTimer");
    const bidPillContainer = document.getElementById("bidPillContainer");
    const bidPillFill = document.getElementById("bidPillFill");
    const bidPillText = document.getElementById("bidPillText");
    const bidPillChevron = document.getElementById("bidPillChevron");
    const maxBidBtn = document.getElementById("maxBidBtn");
    const phase = auction.phase;

    if (phase === "active") {
      auctionStatusRow.classList.remove("hidden");
      auctionWinner.textContent = auction.winner ? `🏆 ${auction.winner} is winning` : "";
      auctionTimer.textContent = formatTimer(auction.remaining_seconds);
      const suggestedBid = auction.recommended_bid ?? auction.price;
      bidPillText.textContent = `Bid ${formatMoney(suggestedBid, auction.currency)}`;
      bidPillFill.classList.remove("muted");
      bidPillContainer.classList.remove("muted");
      bidPillChevron.classList.remove("hidden");
      maxBidBtn.classList.remove("muted");
    } else if (phase === "ended") {
      auctionStatusRow.classList.remove("hidden");
      auctionWinner.textContent = auction.winner ? `🏆 ${auction.winner} won` : "No bids";
      auctionTimer.textContent = formatTimer(0);
      bidPillText.textContent = "Sold out";
      bidPillFill.classList.add("muted");
      bidPillContainer.classList.add("muted");
      bidPillChevron.classList.add("hidden");
      maxBidBtn.classList.add("muted");
    } else {
      // "pinned" - up next, bidding hasn't started yet.
      auctionStatusRow.classList.add("hidden");
      bidPillText.textContent = "Starting soon";
      bidPillFill.classList.add("muted");
      bidPillContainer.classList.add("muted");
      bidPillChevron.classList.add("hidden");
      maxBidBtn.classList.add("muted");
    }
  }

  window.applyState = applyState;
</script>
</body>
</html>
