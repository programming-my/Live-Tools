<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Lets this page launch chrome-free (no Safari URL/tab bars) when added
     to the iOS home screen - see README for the "Add to Home Screen" steps.
     iOS Safari has no reliable in-page fullscreen API, so this is the
     actual mechanism, not the requestFullscreen() button below. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>eBay Live Overlay</title>
<link rel="stylesheet" href="/static/overlay.css">
</head>
<body>
  <div class="overlay">
    <div class="status-pill hidden" id="statusPill"></div>

    <div class="content-stack">
      <div class="chat-panel" id="chatPanel">
        <div class="chat-controls" id="chatControls">
          <span class="chat-controls-label">Chat text size</span>
          <button type="button" id="chatFontDec" aria-label="Decrease chat text size">A-</button>
          <button type="button" id="chatFontInc" aria-label="Increase chat text size">A+</button>
          <button type="button" class="fullscreen-btn hidden" id="fullscreenBtn" aria-label="Toggle fullscreen">⛶</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
      </div>

      <div class="auction-card hidden" id="auctionCard">
        <div class="auction-title" id="auctionTitle"></div>
        <div class="auction-price" id="auctionPrice"></div>
        <div class="auction-row">
          <span class="auction-winner" id="auctionWinner"></span>
          <span class="auction-timer" id="auctionTimer"></span>
        </div>
        <div class="auction-buttons">
          <div class="btn-max-bid">Max bid</div>
          <div class="btn-bid">
            <div class="btn-bid-fill" id="bidPillFill">
              <span id="bidPillText">Bid now</span>
              <svg id="bidPillChevron" viewBox="135 17 24 21" xmlns="http://www.w3.org/2000/svg">
                <path fill="#0c310d" d="M157.6803,29.0305l-8.3939,8.3941c-.5472.5464-1.4327.5464-1.9789,0-.5462-.5463-.5462-1.4321,0-1.9785l7.405-7.4049-7.405-7.4049c-.5462-.5464-.5462-1.4321,0-1.9785.5462-.5464,1.4317-.5464,1.9789,0l8.3939,8.3942c.5462.5464.5462,1.4322,0,1.9785ZM146.4887,29.0305l-8.3939,8.3941c-.5462.5464-1.4317.5464-1.9789,0-.5462-.5463-.5462-1.4321,0-1.9785l7.405-7.4049-7.405-7.4049c-.5462-.5464-.5462-1.4321,0-1.9785.5472-.5464,1.4327-.5464,1.9789,0l8.3939,8.3942c.5462.5464.5462,1.4322,0,1.9785Z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="/static/overlay.js"></script>
</body>
</html>
